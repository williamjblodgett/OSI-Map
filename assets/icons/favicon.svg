<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#030a0f"/>
  <!-- outer radar rings -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="#0d3348" stroke-width="10"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#0d3348" stroke-width="7"/>
  <circle cx="256" cy="256" r="92" fill="none" stroke="#0d3348" stroke-width="6"/>
  <!-- globe meridians -->
  <ellipse cx="256" cy="256" rx="208" ry="76" fill="none" stroke="#0a2a3c" stroke-width="6"/>
  <ellipse cx="256" cy="256" rx="76" ry="208" fill="none" stroke="#0a2a3c" stroke-width="6"/>
  <!-- crosshair -->
  <line x1="256" y1="20" x2="256" y2="120" stroke="#00d4ff" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="392" x2="256" y2="492" stroke="#00d4ff" stroke-width="12" stroke-linecap="round"/>
  <line x1="20" y1="256" x2="120" y2="256" stroke="#00d4ff" stroke-width="12" stroke-linecap="round"/>
  <line x1="392" y1="256" x2="492" y2="256" stroke="#00d4ff" stroke-width="12" stroke-linecap="round"/>
  <!-- radar sweep wedge -->
  <path d="M256 256 L256 48 A208 208 0 0 1 436 152 Z" fill="url(#sweep)"/>
  <line x1="256" y1="256" x2="436" y2="152" stroke="#00d4ff" stroke-width="8" stroke-linecap="round"/>
  <!-- contact blips -->
  <circle cx="330" cy="180" r="16" fill="#00d4ff"/>
  <circle cx="186" cy="318" r="12" fill="#ff4d00"/>
  <circle cx="316" cy="330" r="10" fill="#00ff88"/>
  <!-- center -->
  <circle cx="256" cy="256" r="20" fill="#00d4ff"/>
  <circle cx="256" cy="256" r="34" fill="none" stroke="#00d4ff" stroke-width="6" opacity="0.5"/>
</svg>
